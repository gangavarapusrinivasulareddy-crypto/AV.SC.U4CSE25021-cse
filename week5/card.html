<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3 cards</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2e3;
        }

        /* Main Heading */
        .main-heading {
            text-align: center;
            margin-top: 30px;
            font-size: 32px;
            color: #333;
        }

        /* Card container */
        .card-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px;
        }

        /* Card */
        .card {
            background-color: #ffffff;
            width: 260px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
        }

        /* Image */
        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        /* Content */
        .card-content {
            padding: 20px;
        }

        .card h2 {
            margin: 10px 0;
        }

        .card p {
            color: #555555;
            font-size: 14px;
        }

        /* Button */
        .card button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            background-color: #0008ff;
            color: rgb(255, 255, 255);
            border-radius: 5px;
            cursor: pointer;
        }

        .card button:hover {
            background-color: #001bb3;
        }
    </style>
</head>

<body>

    <!-- Main Heading -->
    <h1 class="main-heading">My Beautiful Landscapes</h1>

    <div class="card-container">

        <!-- Card 1 -->
        <div class="card">
            <img src="https://media.istockphoto.com/id/485371557/photo/twilight-at-spirit-island.jpg?s=612x612&w=0&k=20&c=FSGliJ4EKFP70Yjpzso0HfRR4WwflC6GKfl4F3Hj7fk=" alt="Image 1">
            <div class="card-content">
                <h2>Landscape</h2>
                <p>A nice view</p>
                <button>View</button>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="card">
            <img src="https://media.istockphoto.com/id/485371557/photo/twilight-at-spirit-island.jpg?s=612x612&w=0&k=20&c=FSGliJ4EKFP70Yjpzso0HfRR4WwflC6GKfl4F3Hj7fk=" alt="Image 2">
            <div class="card-content">
                <h2>Landscape</h2>
                <p>A reflecting mirror</p>
                <button>View</button>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="card">
            <img src="https://media.istockphoto.com/id/485371557/photo/twilight-at-spirit-island.jpg?s=612x612&w=0&k=20&c=FSGliJ4EKFP70Yjpzso0HfRR4WwflC6GKfl4F3Hj7fk=" alt="Image 3">
            <div class="card-content">
                <h2>Landscape</h2>
                <p>Beautiful landscape</p>
                <button>View</button>
            </div>
        </div>

    </div>

</body>
</html>
