<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Navigation Bar */
        .navbar {
            background-color: #222;
            padding: 15px;
            text-align: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 25px;
            font-size: 18px;
            padding: 8px 12px;
        }

        .navbar a:hover {
            background-color: orange;
            border-radius: 5px;
        }

        /* Iframe Section */
        iframe {
            width: 100%;
            height: 90vh;   /* Full screen height */
            border: none;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <div class="navbar">
        <a href="home.html" target="content">Home</a>
        <a href="about.html" target="content">About</a>
        <a href="contact.html" target="content">Contact</a>
    </div>

    <!-- Content loads here -->
    <iframe name="content" src="home.html"></iframe>

</body>
</html>
