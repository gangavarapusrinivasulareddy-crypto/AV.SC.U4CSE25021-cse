<!DOCTYPE html>
<html>
<head>
    <title>Sign Up Form</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            background: #f2f2f2;
        }
        .card {
            width: 350px;
            margin: 60px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        h2 {
            color: purple;
            font-style: oblique;
            text-align: center;
            font-size: x-large;
        }
        .field {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: purple;
            color: white;
            border: none;
            cursor: pointer;
        }
        .error {
            color: red;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Sign Up</h2>

    <form id="registrationForm">
        <div class="field">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name">
            <div id="nameError" class="error">Name is required.</div>
        </div>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="email@example.com">
            <div id="emailError" class="error">Please enter a valid email.</div>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Min. 6 characters">
            <div id="passError" class="error">Password must be at least 6 characters.</div>
        </div>

        <button type="submit">Register</button>
    </form>
</div>

<script>
document.getElementById("registrationForm").addEventListener("submit", function(event) {
    event.preventDefault();

    document.querySelectorAll(".error").forEach(el => el.style.display = "none");

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    let isValid = true;

    if (name === "") {
        document.getElementById("nameError").style.display = "block";
        isValid = false;
    }

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
        document.getElementById("emailError").style.display = "block";
        isValid = false;
    }

    if (password.length < 6) {
        document.getElementById("passError").style.display = "block";
        isValid = false;
    }

    if (isValid) {
        alert("Registration successful!");
    }
});
</script>

</body>
</html>
