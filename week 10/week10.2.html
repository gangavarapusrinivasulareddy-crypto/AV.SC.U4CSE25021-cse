<!DOCTYPE html>
<html>
<head>
<title>LOL OK Program</title>
<style>
body {
    font-family: Arial;
    background-color: yellow;
    text-align: center;
    margin-top: 50px;
}
.box {
    background: white;
    padding: 20px;
    display: inline-block;
    border-radius: 10px;
    box-shadow: 0 0 10px gray;
}
button {
    padding: 10px;
    background: purple;
    color: white;
    border: none;
    cursor: pointer;
}
#output {
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>
<body>
<div class="box">
    <h2>LOL - OK Program (1 to 100)</h2>
    <button onclick="checkNumbers()">Run Program</button>
    <div id="output"></div>
</div>

<script>
function checkNumbers() {
    let result = "";

    for (let i = 1; i <= 100; i++) {

        if (i % 3 === 0 && i % 5 === 0) {
            result += "LOL-OK<br>";
        } 
        else if (i % 3 === 0) {
            result += "LOL<br>";
        } 
        else if (i % 5 === 0) {
            result += "OK<br>";
        } 
        else {
            result += i + "<br>";
        }
    }

    document.getElementById("output").innerHTML = result;
}
</script>
</body>
</html>
