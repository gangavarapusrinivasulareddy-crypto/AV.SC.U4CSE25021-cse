<!DOCTYPE html>
<html>
<head>
    <title>Find Sign of the given numbers</title>
    <style>
        body {
            font-family: Arial;
            background: lavenderblush;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
        }
        h2 {
            margin-bottom: 15px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid ;
            border-color: aquamarine;
        }
        button {
            padding: 10px 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
<div class="box">
    <h2>Find Sign of 3 Numbers</h2>
    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">
    <input type="number" id="num3" placeholder="Enter third number">
    <br><br>
    <button onclick="findSign()">Check Sign</button>
</div>
<script>
function findSign() {
    let a = parseInt(document.getElementById("num1").value);
    let b = parseInt(document.getElementById("num2").value);
    let c = parseInt(document.getElementById("num3").value);
    let product = a * b * c;
    if (product > 0) {
        alert("The sign is Plus (+)");
    } 
    else if (product < 0) {
        alert("The sign is Minus (-)");
    } 
    else {
 alert("The sign is Zero (0)");
    }
}
</script>
</body>
</html>
