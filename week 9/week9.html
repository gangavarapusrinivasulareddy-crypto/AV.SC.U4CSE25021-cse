<!DOCTYPE html>
<html lang="en">
<head>
    <title>Number Checker</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
            width: 350px;
        }

        input {
            padding: 10px;
            width: 80%;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid gray;
        }

        button {
            margin: 5px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        #result {
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Number Checker</h2>
    <input type="number" id="num" placeholder="Enter a number">

    <div>
        <button onclick="checkEvenOdd()">Even / Odd</button>
        <button onclick="checkPrime()">Prime</button>
        <button onclick="factorial()">Factorial</button>
        <button onclick="checkArmstrong()">Armstrong</button>
    </div>

    <p id="result"></p>
</div>

<script>
    function getNumber() {
        return parseInt(document.getElementById("num").value);
    }

    function checkEvenOdd() {
        let n = getNumber();
        if (n % 2 === 0) {
            document.getElementById("result").innerText = n + " is Even";
        } else {
            document.getElementById("result").innerText = n + " is Odd";
        }
    }

    function checkPrime() {
        let n = getNumber();
        let isPrime = true;

        if (n <= 1) isPrime = false;

        for (let i = 2; i <= Math.sqrt(n); i++) {
            if (n % i === 0) {
                isPrime = false;
                break;
            }
        }

        document.getElementById("result").innerText =
            isPrime ? n + " is Prime" : n + " is Not Prime";
    }

    function factorial() {
        let n = getNumber();
        let fact = 1;

        for (let i = 1; i <= n; i++) {
            fact *= i;
        }

        document.getElementById("result").innerText =
            "Factorial of " + n + " is " + fact;
    }

    function checkArmstrong() {
        let n = getNumber();
        let sum = 0;
        let temp = n;
        let digits = n.toString().length;

        while (temp > 0) {
            let rem = temp % 10;
            sum += Math.pow(rem, digits);
            temp = Math.floor(temp / 10);
        }

        document.getElementById("result").innerText =
            (sum === n) ? n + " is Armstrong" : n + " is Not Armstrong";
    }
</script>

</body>
</html>
